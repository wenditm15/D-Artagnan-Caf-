<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Artagnan Café — Iniciar Sesión</title> 
    <link rel="stylesheet" href="../Css/Dartagnan_Cofe.css">
    <link rel="stylesheet" href="../Css/login-registro.css">
</head>
<body>
    <header class="header">
        <img src="../Images/Imagen-Logo.png" alt="Logo de D'Artagnan Café" width="250" height="100">
        <nav>
            <ul>
                <li><a href="../DArtagnan_Cafe.html">Inicio</a></li>
                <li><a href="../DArtagnan_Cafe.html#menu">Menú</a></li>
                <li><a href="../DArtagnan_Cafe.html#eventos">Eventos</a></li>
                <li><a href="../DArtagnan_Cafe.html#contacto">Contacto</a></li>
            </ul>
        </nav>

        <div class="botones">
            <a href="login.html" class="btn-ingresar">Ingresar</a>
            <a href="formulario.html" class="btn-reservar">Reservar</a>
        </div>
    </header>
 
    <main class="main-content">
        <section class="form-section">
            <div class="form-card">
                <h2>Iniciar Sesión</h2>
                <p>Accede a tu cuenta de D'Artagnan Café</p>
                
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="username">Usuario o Correo electrónico *</label>
                        <input type="text" id="username" name="username" required placeholder="usuario o correo@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña *</label>
                        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                    </div>

                    <div class="form-row">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember"> Recordarme
                        </label>
                        <a href="#" class="form-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="button btn-block">Iniciar sesión</button>
                </form>

                <p class="form-footer-text">
                    ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </p>
            </div>
        </section>
    </main>
 
    <footer>
        <p>D'Artagnan Café - Todos por un buen café</p>
    </footer>
</body>
</html>
