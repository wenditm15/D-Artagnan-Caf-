<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>D'Artagnan Café - Eventos</title>
    <link rel="stylesheet" href="style/estilos.css">
</head>
<body>

    <section class="formulario">
        <h2>D'Artagnan Café</h2>
        <p class="subtitulo">Registro para Eventos</p>
        
        <form>
            <p>Nombre</p>
            <input type="text">

            <p>Apellido</p>
            <input type="text">

            <p>Número de contacto</p>
            <input type="text">

            <p>Correo electrónico</p>
            <input type="text">

            <p>Método de pago</p>
            <select>
                <option>Efectivo</option>
                <option>Tarjeta</option>
                <option>Transferencia</option>
            </select>

            <button type="submit" class="boton">Reservar lugar</button>
        </form>
    </section>

</body>
</html>
